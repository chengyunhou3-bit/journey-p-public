<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Journey P｜登入</title>
  <link rel="icon" type="image/png" sizes="64x64" href="static/favicon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="static/app-icon.png">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,#203a3d,#08101b 58%,#030506);color:#f0ddb4;font-family:"Noto Serif TC","Microsoft JhengHei",serif}.card{width:min(480px,100%);padding:38px 34px;text-align:center;border:3px solid #805a2a;outline:2px solid #c99a4b;background:linear-gradient(145deg,#191713,#0a0d0c);box-shadow:inset 0 0 0 3px #2e2112,0 25px 70px #000}.crest{font-size:3rem;filter:drop-shadow(0 3px 5px #000)}h1{margin:10px 0 5px;font-size:2rem;letter-spacing:.12em}p{margin:8px auto 22px;color:#bba984;line-height:1.8}.login{display:block;width:100%;padding:12px;border:2px solid #a87c3d;background:linear-gradient(#31593a,#17341f);color:#fff0c8;font:900 1rem inherit;cursor:pointer;box-shadow:inset 0 0 0 2px #152817}.login:hover{filter:brightness(1.15)}.login:disabled{opacity:.7;cursor:wait}.status{min-height:24px;margin-top:14px;color:#ffb0a7;font-size:.82rem;line-height:1.6}.status.ok{color:#b9df9b}
  </style>
</head>
<body>
  <main class="card">
    <div class="crest">🧭</div>
    <h1>JOURNEY P</h1>
    <p>每一天，都是旅程的一部分。<br>使用 Google 帳號開啟你的冒險紀錄。</p>
    <button class="login" id="login" type="button">使用 Google 登入</button>
    <div class="status" id="status" role="status">正在確認旅人身分……</div>
  </main>
  <script src="static/supabase.min.js"></script>
  <script>
    (async()=>{
      const status=document.querySelector('#status'),button=document.querySelector('#login');
      const client=window.supabase.createClient('https://aevoxzippmtipliacssb.supabase.co','sb_publishable_w39rFG2ut8KrRgtVaIgJtA_FpXj7rkV',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce'}});
      const showError=error=>{status.classList.remove('ok');status.textContent=`登入失敗：${error.message}`;button.disabled=false;button.textContent='重新使用 Google 登入'};
      const params=new URLSearchParams(location.search),oauthError=params.get('error_description')||params.get('error');
      if(oauthError)throw new Error(oauthError);
      const code=params.get('code');
      if(code){status.classList.add('ok');status.textContent='登入成功，正在開啟旅程……';const{error}=await client.auth.exchangeCodeForSession(code);if(error)throw error;location.replace('app.html');return}
      const{data:{session},error:sessionError}=await client.auth.getSession();if(sessionError)throw sessionError;
      if(session){location.replace('app.html');return}
      status.textContent='';
      button.addEventListener('click',async()=>{button.disabled=true;button.textContent='正在前往 Google……';status.textContent='';const{error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://chengyunhou3-bit.github.io/journey-p-public/'}});if(error)showError(error)});
    })().catch(error=>{const status=document.querySelector('#status');status.textContent=`登入失敗：${error.message}`;const button=document.querySelector('#login');button.disabled=false;button.textContent='重新使用 Google 登入';console.error(error)});
  </script>
</body>
</html>
